name: CI
on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: app/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov --cov-fail-under=85

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t autoseguro-agent .
      - name: Smoke test do container
        run: |
          docker run -d --name agent -p 8080:8080 autoseguro-agent
          for i in $(seq 1 20); do curl -sf localhost:8080/health && exit 0; sleep 1; done
          docker logs agent; exit 1
      - name: Testes na imagem de teste (mesmo comando do README)
        working-directory: .
        run: docker compose run --rm --build tests

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: app/uv.lock
      - name: Sobe a quote-api real
        working-directory: .
        run: |
          docker compose up -d --build quote-api
          for i in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          docker compose logs quote-api; exit 1
      - run: uv sync --frozen
      - run: uv run pytest -m integration
