services:
  quote-api:
    build: ./quote-service
    ports:
      - "8000:8000"
    environment:
      # instabilidade simulada (de proposito) -- sobrescreva no .env ou no shell durante o dev/QA
      QUOTE_FAILURE_RATE: ${QUOTE_FAILURE_RATE:-0.20}
      QUOTE_SLOW_RATE: ${QUOTE_SLOW_RATE:-0.10}
      QUOTE_SLOW_SECONDS: ${QUOTE_SLOW_SECONDS:-8}
      QUOTE_SEED: ${QUOTE_SEED:-}   # defina p/ falhas reproduziveis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  agent:
    build:
      context: ./app
      target: runtime
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      QUOTE_API_URL: http://quote-api:8000
    depends_on:
      quote-api:
        condition: service_healthy
    restart: unless-stopped

  # Testes em container (não sobe no `up`): docker compose run --rm tests
  # Integração contra a quote-api real: docker compose run --rm tests pytest -m integration
  tests:
    build:
      context: ./app
      target: test
    profiles: ["test"]
    depends_on:
      quote-api:
        condition: service_healthy
